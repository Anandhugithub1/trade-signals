name: Check Signals

on:
  schedule:
    - cron: '30 0-19 * * *'  # every hour at :30 — UTC 0:30–19:30 = IST 6am–1am
  # Skips UTC 20:30–23:30 = IST 2am–5:30am (sleep window)
  # Offset by 30 min so it never collides with generate_signals (runs at :00)
  workflow_dispatch:         # manual trigger from GitHub Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/check_signals/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/check_signals/requirements.txt

      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json

      - name: Run check_signals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_PATH: /tmp/firebase-sa.json
        run: python backend/check_signals/handler.py
