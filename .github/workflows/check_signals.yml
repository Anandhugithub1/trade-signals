name: Check Signals

on:
  schedule:
    - cron: '0 2 * * *'   # 2:00 AM UTC daily — checks SL/TP + expires + 90-day cleanup
  workflow_dispatch:        # manual trigger from GitHub Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/check_signals/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/check_signals/requirements.txt

      - name: Run check_signals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/check_signals/handler.py
