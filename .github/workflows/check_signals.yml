name: Check Signals

on:
  schedule:
    - cron: '30 * * * *'   # every hour at :30 — checks SL/TP hits, expiry, 90-day cleanup
  # Offset by 30 min so it doesn't run at the same time as generate_signals
  workflow_dispatch:         # manual trigger from GitHub Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/check_signals/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/check_signals/requirements.txt

      - name: Run check_signals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/check_signals/handler.py
