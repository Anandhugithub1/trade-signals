name: Crypto Option Signals (retired — resolver only)

# RETIRED 2026-09-25: no edge once option time decay is priced in. See
# "crypto option trading/README.md" -> "Retired" for the full numbers.
#
# NEW SIGNALS: no longer generated on schedule. The generation step only
# runs on a manual workflow_dispatch (kept for testing / re-evaluation).
#
# RESOLVER: still runs every 6h so positions opened before retirement close
# out properly instead of sitting 'pending' forever. check_signals.py
# replays candles from each signal's entry time, so running it less often
# doesn't change any outcome — it only changes when it gets recorded. With
# nothing pending it exits in seconds.
#
# The crypto_option_signals table, schema and RLS are untouched, so every
# installed app version keeps showing the existing history without errors.
on:
  schedule:
    - cron: '35 */6 * * *'   # resolver only (see above)
  workflow_dispatch:
    inputs:
      max_loss:
        description: 'Max loss per trade (USD)'
        required: false
        default: '200'

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'crypto option trading/requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r "crypto option trading/requirements.txt"
          pip install supabase python-dotenv

      # Retired: manual runs only, never on the schedule.
      - name: Generate signals (BTC + ETH) — manual runs only
        if: github.event_name == 'workflow_dispatch'
        env:
          MAX_LOSS: ${{ github.event.inputs.max_loss || '200' }}
          SYMBOLS: 'BTCUSDT,ETHUSDT'
          INTERVAL: '1h'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: 'crypto option trading'
        run: python src/run_signal.py

      # Close out open positions: mark win/loss/expired, record pnl_usd and
      # closed_at.
      - name: Check open signals
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: 'crypto option trading'
        run: python src/check_signals.py
