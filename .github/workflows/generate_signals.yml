name: Generate Signals

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours — matches 4h candle timeframe
  # Each run checks today's count and only fills up to the 3-signal daily cap.
  workflow_dispatch:          # manual trigger from GitHub Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/generate_signals/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/generate_signals/requirements.txt

      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json

      - name: Run generate_signals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_PATH: /tmp/firebase-sa.json
        run: python backend/generate_signals/handler.py
