name: NIFTY Option Signals (disabled — replaced by Crypto Option Signals)

# DISABLED 2026-08-19: superseded by .github/workflows/crypto_option_signals.yml
# and the "crypto option trading" module. The app's Options tab now reads
# crypto_option_signals instead of nifty_option_signals. The NIFTY code and
# this workflow are kept on disk (not deleted) in case NIFTY signals are
# wanted again later, but the schedule trigger is removed so it no longer
# runs or writes to the live table. Use workflow_dispatch to run it manually
# if ever needed.
#
# NIFTY market hours are 09:15-15:30 IST.
# GitHub cron runs in UTC, and IST = UTC+5:30, so:
#   09:15 IST = 03:45 UTC   ...   15:30 IST = 10:00 UTC
# We run every 15 minutes across that window, Monday-Friday.
# NOTE: GitHub's scheduled runs can be delayed by several minutes under load,
# and skip on public-repo inactivity after ~60 days — treat timing as approximate.
#
# The job has TWO steps with different windows:
#   run_signal.py         only generates inside 09:15-15:30 IST (it self-gates,
#                         so a delayed run cannot post an untradeable signal).
#   check_nifty_signals.py must ALSO run at/after the close to square off open
#                         positions — which is why the 10:00 UTC (15:30 IST)
#                         slot stays. Generation no-ops there by design; the
#                         square-off is the whole point of that run.
on:
  workflow_dispatch:            # manual "Run workflow" button only — schedule removed
    inputs:
      max_loss:
        description: 'Max loss per trade (Rs)'
        required: false
        default: '1250'

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'nifty option trading/requirements.txt'

      - name: Install dependencies
        run: pip install -r "nifty option trading/requirements.txt"

      # Self-gates on market hours: outside 09:15-15:30 IST this prints
      # "Market closed" and exits 0. That is expected on the close-time run.
      - name: Generate signal (skips outside market hours)
        env:
          MAX_LOSS: ${{ github.event.inputs.max_loss || '1250' }}
          INTERVAL: '15m'
          PERIOD: '5d'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: 'nifty option trading'
        run: python src/run_signal.py

      # Close out open positions: mark win/loss/expired, record pnl_rs and
      # closed_at. Without this every signal stays 'pending' forever and the
      # app's win-rate / P&L cards read as empty. Runs even if generation
      # failed, since open trades still need to be squared off.
      - name: Check open signals
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: 'nifty option trading'
        run: python src/check_nifty_signals.py
