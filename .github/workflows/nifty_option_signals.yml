name: NIFTY Option Signals

# NIFTY market hours are 09:15-15:30 IST.
# GitHub cron runs in UTC, and IST = UTC+5:30, so:
#   09:15 IST = 03:45 UTC   ...   15:30 IST = 10:00 UTC
# We run every 15 minutes across that window, Monday-Friday.
# NOTE: GitHub's scheduled runs can be delayed by several minutes under load,
# and skip on public-repo inactivity after ~60 days — treat timing as approximate.
on:
  schedule:
    # 03:45-03:59 UTC (covers the 09:15 IST open)
    - cron: '45,59 3 * * 1-5'
    # 04:00-09:59 UTC every 15 min (09:30-15:29 IST)
    - cron: '0,15,30,45 4-9 * * 1-5'
    # 10:00 UTC (15:30 IST close)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:            # manual "Run workflow" button
    inputs:
      max_loss:
        description: 'Max loss per trade (Rs)'
        required: false
        default: '1250'

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'nifty option trading/requirements.txt'

      - name: Install dependencies
        run: pip install -r "nifty option trading/requirements.txt"

      - name: Generate signal
        env:
          MAX_LOSS: ${{ github.event.inputs.max_loss || '1250' }}
          INTERVAL: '15m'
          PERIOD: '5d'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: 'nifty option trading'
        run: python src/run_signal.py
