name: Refresh Stock Prices

# Updates `latest_price` on OPEN US stock signals every 4h using a live
# quote — does NOT generate new signals and does NOT close trades. Those
# stay on generate_stock_signals/check_stock_signals' own once/day
# schedule (21:30 UTC, after the US close) — see stock_signals.yml.
#
# Harmless to run outside market hours (yfinance just returns the last
# known price), so no market-hours gating — see refresh_prices.py's own
# docstring.
on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/check_stock_signals/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/check_stock_signals/requirements.txt

      - name: Refresh open stock signal prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/check_stock_signals/refresh_prices.py
