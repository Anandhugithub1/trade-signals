name: US Stock Signals (disabled — replaced by New Listing Shorts)

# DISABLED 2026-09-13: superseded by .github/workflows/new_listing_shorts.yml
# and the "short new listings" module. The app's 4th tab now reads
# new_listing_shorts instead of stock_signals. This code and workflow are
# kept on disk (not deleted) in case US stock signals are wanted again
# later, but the schedule trigger is removed so it no longer runs or writes
# to the live table. Use workflow_dispatch to run it manually if ever
# needed.
#
# The stock_signals Supabase table, its schema, and its RLS policies are
# left completely untouched by this deprecation — old installed APKs that
# still show a Stocks tab keep querying stock_signals successfully; the
# feed simply stops getting new rows and ages out gracefully via the app's
# existing 90-day window and empty-state UI (no schema change means no
# crash risk for users who never update).
#
# US market hours are 09:30-16:00 ET. We run ONCE per weekday after the
# close, on completed daily bars — the strategy is a daily-bar swing system,
# so there is nothing to gain from intraday runs.
#
# 21:30 UTC = 16:30 ET (EST, winter) / 17:30 EDT (summer). GitHub cron has no
# timezone support, so this is always >=30 min after the 16:00 ET close in
# either DST regime. Mon-Fri only.
#
# NOTE: yfinance can lag the close by a few minutes; the 30-min buffer covers
# it. Scheduled runs can also be delayed under load — harmless here, since a
# daily bar does not change once the session has ended.
on:
  workflow_dispatch:            # manual "Run workflow" button only — schedule removed

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/generate_stock_signals/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/generate_stock_signals/requirements.txt

      - name: Write Firebase service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-sa.json

      - name: Generate stock signals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_PATH: /tmp/firebase-sa.json
        run: python backend/generate_stock_signals/handler.py

      # Close out open positions. Runs even if generation failed, since open
      # trades still need their stops and targets checked.
      - name: Check open stock signals
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python backend/check_stock_signals/handler.py
